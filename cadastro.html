<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro - GeriAgenda</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="topbar"><div class="brand"><div class="logo">G</div><div><h1>GeriAgenda</h1><p>Agendamento de consultas geriátricas</p></div></div></header>
<main class="container narrow"><a class="back" href="index.html">← Voltar</a><section class="card"><h2>Cadastro do paciente</h2><p class="sub">Preencha seus dados para criar uma conta.</p>
<form id="cadastroForm" class="grid-form"><div><label>Nome completo</label><input id="cadNome" required></div><div><label>CPF</label><input id="cadCpf" required></div><div><label>Data de nascimento</label><input id="cadNasc" type="date" required></div><div><label>Telefone</label><input id="cadTel" required></div><div class="span-2"><label>E-mail</label><input id="cadEmail" type="email" required></div><div><label>Senha</label><input id="cadSenha" type="password" minlength="6" required></div><div><label>Confirmar senha</label><input id="cadSenha2" type="password" minlength="6" required></div><div class="span-2"><button class="btn primary">Criar cadastro</button></div></form><p id="cadMsg"></p></section></main><script src="js/script.js"></script></body></html>
